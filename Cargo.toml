[package]
name = "sliders_popup"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = { version = "0.18", package = "gtk" }
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
